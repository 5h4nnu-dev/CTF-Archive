<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Diagram: the Source attack path from a Webmin version scan through a backdoored CGI to both flags">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 15px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="429" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>

  <text class="t title" x="32" y="46">Source: one backdoor, two flags</text>
  <text class="t sub" x="32" y="70">A compromised build put a root-level command injection inside Webmin 1.890</text>

  <rect class="card" x="30" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="120">01 · RECON</text>
  <text class="t head" x="48" y="146">Two open ports</text>
  <text class="t body" x="48" y="172">22 SSH</text>
  <text class="t body" x="48" y="191">10000 HTTPS</text>
  <text class="t body" x="48" y="210">MiniServ 1.890</text>

  <rect class="card" x="318" y="96" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="120">02 · IDENTIFY</text>
  <text class="t head" x="336" y="146">Backdoored release</text>
  <text class="t body" x="336" y="172">official advisory</text>
  <text class="t body" x="336" y="191">CVE-2019-15107</text>
  <text class="t body" x="336" y="210">SourceForge tarball</text>

  <rect class="card" x="606" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="120">03 · EXPLOIT</text>
  <text class="t head" x="624" y="146">password_change.cgi</text>
  <text class="t body" x="624" y="172">expired parameter</text>
  <text class="t body" x="624" y="191">Perl qx// as root</text>
  <text class="t body" x="624" y="210">no login required</text>

  <rect class="card" x="30" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="294">04 · SHELL</text>
  <text class="t head" x="48" y="320">Root session</text>
  <text class="t body" x="48" y="346">reverse shell</text>
  <text class="t body" x="48" y="365">root@source</text>
  <text class="t body" x="48" y="384">/usr/share/webmin</text>

  <rect class="card" x="318" y="270" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="294">05 · USER FLAG</text>
  <text class="t head" x="336" y="320">/home/dark</text>
  <text class="t body" x="336" y="346">user.txt</text>
  <text class="t body" x="336" y="365">THM{SUPPLY_CHAIN...</text>
  <text class="t body" x="336" y="384">one file to go</text>

  <rect class="card" x="606" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="294">06 · ROOT FLAG</text>
  <text class="t head" x="624" y="320">/root</text>
  <text class="t body" x="624" y="346">root.txt</text>
  <text class="t body" x="624" y="365">THM{UPDATE_YOUR...</text>
  <text class="t body" x="624" y="384">room complete</text>

  <line x1="296" y1="164" x2="314" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="164" x2="602" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="296" y1="338" x2="314" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="338" x2="602" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 738 232 L 738 251 L 162 251 L 162 266" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
