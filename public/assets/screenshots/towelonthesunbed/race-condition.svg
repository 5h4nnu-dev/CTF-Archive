<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Diagram of a race condition: parallel claim requests read the same canClaim state before any write commits, crediting multiple rewards">
  <defs>
    <marker id="tw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 14px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12px; }
      .path { fill: #c7c7dc; font-size: 11.5px; }
      .bad { fill: #f0c8c8; font-size: 12px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>
  <text class="t title" x="32" y="44">Towel on the Sunbed: the TOCTOU window</text>
  <text class="t sub" x="32" y="68">Multiple /claim requests pass the cooldown check before the first write commits</text>

  <rect class="card" x="30" y="98" width="190" height="150" rx="10"/>
  <text class="t step" x="48" y="122">STATE</text>
  <text class="t head" x="48" y="148">Fresh account</text>
  <text class="t mono path" x="48" y="174">balance = 0</text>
  <text class="t mono path" x="48" y="193">canClaim = true</text>
  <text class="t body" x="48" y="219">24h cooldown not</text>
  <text class="t body" x="48" y="236">yet written</text>

  <rect class="card" x="245" y="98" width="200" height="150" rx="10" stroke="#6366f1"/>
  <text class="t step" x="263" y="122">RACE</text>
  <text class="t head" x="263" y="148">Parallel POST /claim</text>
  <text class="t body" x="263" y="174">Request A checks</text>
  <text class="t body" x="263" y="193">Request B checks</text>
  <text class="t body" x="263" y="212">Request C checks...</text>
  <text class="t bad" x="263" y="236">all see canClaim=true</text>

  <rect class="card" x="470" y="98" width="190" height="150" rx="10"/>
  <text class="t step" x="488" y="122">WRITE</text>
  <text class="t head" x="488" y="148">Rewards applied</text>
  <text class="t body" x="488" y="174">Several requests</text>
  <text class="t body" x="488" y="193">credit +50 PONZI</text>
  <text class="t body" x="488" y="219">Cooldown commits</text>
  <text class="t body" x="488" y="236">too late</text>

  <rect class="card" x="685" y="98" width="185" height="150" rx="10" stroke="#6366f1"/>
  <text class="t step" x="703" y="122">RESULT</text>
  <text class="t head" x="703" y="148">Whale tier</text>
  <text class="t mono path" x="703" y="174">balance &gt;= 150</text>
  <text class="t body" x="703" y="200">GET /vault</text>
  <text class="t body" x="703" y="219">returns the flag</text>

  <line x1="222" y1="173" x2="241" y2="173" stroke="#6366f1" stroke-width="2" marker-end="url(#tw-arrow)"/>
  <line x1="447" y1="173" x2="466" y2="173" stroke="#6366f1" stroke-width="2" marker-end="url(#tw-arrow)"/>
  <line x1="662" y1="173" x2="681" y2="173" stroke="#6366f1" stroke-width="2" marker-end="url(#tw-arrow)"/>

  <text class="t body" x="32" y="286">Fix: make the claim check-and-write atomic (transaction/unique constraint/lock).</text>
</svg>
