<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Diagram: the Smag Grotto attack path from a leaked packet capture to root">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 15px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="429" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>

  <text class="t title" x="32" y="46">Smag Grotto: from a packet capture to root</text>
  <text class="t sub" x="32" y="70">Six steps: a leaked login, a web command box, a self-healing SSH key, and a sudo rule</text>

  <!-- Row 1 -->
  <rect class="card" x="30" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="120">01 · PORTS 22 / 80</text>
  <text class="t head" x="48" y="146">A quiet server</text>
  <text class="t body" x="48" y="172">OpenSSH 7.2p2</text>
  <text class="t body" x="48" y="191">Apache 2.4.18</text>
  <text class="t body" x="48" y="210">gobuster → /mail</text>

  <rect class="card" x="318" y="96" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="120">02 · /MAIL</text>
  <text class="t head" x="336" y="146">The leaked pcap</text>
  <text class="t body" x="336" y="172">three emails, one file</text>
  <text class="t body" x="336" y="191">POST /login.php</text>
  <text class="t body" x="336" y="210">helpdesk credentials</text>

  <rect class="card" x="606" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="120">03 · VHOST</text>
  <text class="t head" x="624" y="146">development.smag.thm</text>
  <text class="t body" x="624" y="172">login → admin.php</text>
  <text class="t body" x="624" y="191">command box as</text>
  <text class="t body" x="624" y="210">www-data</text>

  <!-- Row 2 -->
  <rect class="card" x="30" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="294">04 · CRON</text>
  <text class="t head" x="48" y="320">A writable source</text>
  <text class="t body" x="48" y="346">backup file is 666</text>
  <text class="t body" x="48" y="365">root copies it into</text>
  <text class="t body" x="48" y="384">jake's authorized_keys</text>

  <rect class="card" x="318" y="270" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="294">05 · LATERAL</text>
  <text class="t head" x="336" y="320">jake's account</text>
  <text class="t body" x="336" y="346">paste your public key</text>
  <text class="t body" x="336" y="365">wait one minute</text>
  <text class="t body" x="336" y="384">ssh -i key jake@smag</text>

  <rect class="card" x="606" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="294">06 · PRIVESC</text>
  <text class="t head" x="624" y="320">sudo apt-get</text>
  <text class="t body" x="624" y="346">NOPASSWD rule</text>
  <text class="t body" x="624" y="365">APT::Update::</text>
  <text class="t body" x="624" y="384">Pre-Invoke → root</text>

  <!-- Arrows within rows -->
  <line x1="296" y1="164" x2="314" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="164" x2="602" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="296" y1="338" x2="314" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="338" x2="602" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Elbow from step 3 to step 4 -->
  <path d="M 738 232 L 738 251 L 162 251 L 162 266" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
