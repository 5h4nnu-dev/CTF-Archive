<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Poster attack chain: PostgreSQL default creds to RCE, credential reuse to dark and alison, sudo to root">
  <defs>
    <marker id="po-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 14px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12px; }
      .path { fill: #c7c7dc; font-size: 11.5px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="359" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>
  <text class="t title" x="32" y="44">Poster: default database creds to full root</text>
  <text class="t sub" x="32" y="68">One exposed PostgreSQL service, two credential pivots, one sudo misconfiguration</text>

  <rect class="card" x="30" y="96" width="190" height="190" rx="10"/>
  <text class="t step" x="48" y="120">01 · ENUM</text>
  <text class="t head" x="48" y="146">PostgreSQL</text>
  <text class="t mono path" x="48" y="172">5432/tcp</text>
  <text class="t body" x="48" y="198">Metasploit login</text>
  <text class="t body" x="48" y="217">scanner finds</text>
  <text class="t mono path" x="48" y="243">postgres:password</text>

  <rect class="card" x="240" y="96" width="190" height="190" rx="10" stroke="#6366f1"/>
  <text class="t step" x="258" y="120">02 · RCE</text>
  <text class="t head" x="258" y="146">COPY PROGRAM</text>
  <text class="t mono path" x="258" y="172">postgres_copy_</text>
  <text class="t mono path" x="258" y="189">from_program...</text>
  <text class="t body" x="258" y="217">Command execution</text>
  <text class="t body" x="258" y="236">as postgres</text>

  <rect class="card" x="450" y="96" width="190" height="190" rx="10"/>
  <text class="t step" x="468" y="120">03 · PIVOT</text>
  <text class="t head" x="468" y="146">Credential files</text>
  <text class="t mono path" x="468" y="172">dark creds</text>
  <text class="t body" x="468" y="198">/home/dark/</text>
  <text class="t mono path" x="468" y="224">config.php</text>
  <text class="t body" x="468" y="250">alison DB pass</text>

  <rect class="card" x="660" y="96" width="230" height="190" rx="10" stroke="#6366f1"/>
  <text class="t step" x="678" y="120">04 · ROOT</text>
  <text class="t head" x="678" y="146">sudo -l</text>
  <text class="t mono path" x="678" y="172">(ALL : ALL) ALL</text>
  <text class="t body" x="678" y="198">Alison can run any</text>
  <text class="t body" x="678" y="217">command as root</text>
  <text class="t mono path" x="678" y="243">sudo su / root.txt</text>

  <line x1="222" y1="191" x2="236" y2="191" stroke="#6366f1" stroke-width="2" marker-end="url(#po-arrow)"/>
  <line x1="432" y1="191" x2="446" y2="191" stroke="#6366f1" stroke-width="2" marker-end="url(#po-arrow)"/>
  <line x1="642" y1="191" x2="656" y2="191" stroke="#6366f1" stroke-width="2" marker-end="url(#po-arrow)"/>

  <text class="t body" x="32" y="322">Local artifacts captured creds and both flags; public writeups corroborate the same chain.</text>
</svg>
