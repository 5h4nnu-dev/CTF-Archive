<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Diagram of the Beach Bar attack chain: HTML comment credentials, unsafe YAML import, shell as bartender, root password reused from a process argument">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 14px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12px; }
      .path { fill: #c7c7dc; font-size: 11.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="349" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>
  <text class="t title" x="32" y="44">Beach Bar: four small mistakes in one chain</text>
  <text class="t sub" x="32" y="68">A demo login, an unsafe parser, a secret in argv, and password reuse</text>

  <rect class="card" x="30" y="96" width="195" height="186" rx="10"/>
  <text class="t step" x="48" y="120">01 · ENTRY</text>
  <text class="t head" x="48" y="146">HTML comment</text>
  <text class="t body" x="48" y="172">Source of /login</text>
  <text class="t body" x="48" y="191">staff note with</text>
  <text class="t mono path" x="48" y="216">dj / dj</text>
  <text class="t body" x="48" y="243">Signed session</text>
  <text class="t body" x="48" y="262">cookie issued</text>

  <rect class="card" x="245" y="96" width="195" height="186" rx="10"/>
  <text class="t step" x="263" y="120">02 · SURFACE</text>
  <text class="t head" x="263" y="146">YAML round trip</text>
  <text class="t mono path" x="263" y="172">/export</text>
  <text class="t body" x="263" y="191">sample playlist</text>
  <text class="t mono path" x="263" y="216">/import</text>
  <text class="t body" x="263" y="243">paste or upload</text>
  <text class="t body" x="263" y="262">a .yml file</text>

  <rect class="card" x="460" y="96" width="195" height="186" rx="10" stroke="#6366f1"/>
  <text class="t step" x="478" y="120">03 · RCE</text>
  <text class="t head" x="478" y="146">Unsafe loader</text>
  <text class="t mono path" x="478" y="172">yaml.Loader</text>
  <text class="t body" x="478" y="191">builds Python</text>
  <text class="t mono path" x="478" y="216">object/apply</text>
  <text class="t body" x="478" y="243">shell as</text>
  <text class="t mono path" x="478" y="262">bartender</text>

  <rect class="card" x="675" y="96" width="195" height="186" rx="10" stroke="#6366f1"/>
  <text class="t step" x="693" y="120">04 · ROOT</text>
  <text class="t head" x="693" y="146">Process listing</text>
  <text class="t mono path" x="693" y="172">ps auxww</text>
  <text class="t body" x="693" y="191">root jukeboxd</text>
  <text class="t mono path" x="693" y="216">--stream-pass</text>
  <text class="t body" x="693" y="243">reused for su</text>
  <text class="t mono path" x="693" y="262">uid=0(root)</text>

  <line x1="227" y1="189" x2="241" y2="189" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="189" x2="456" y2="189" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="657" y1="189" x2="671" y2="189" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="t body" x="32" y="318">The web app ran as bartender, so RCE did not mean root — until the leaked service password was reused.</text>
</svg>
