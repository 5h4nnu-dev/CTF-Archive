<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Diagram: the Couch attack path from an unauthenticated CouchDB to root through the Docker API">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 15px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="429" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>

  <text class="t title" x="32" y="46">Couch: from an open database to root</text>
  <text class="t sub" x="32" y="70">Six steps: no database auth, a reused password, and an exposed Docker daemon</text>

  <!-- Row 1 -->
  <rect class="card" x="30" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="120">01 · COUCHDB 5984</text>
  <text class="t head" x="48" y="146">Open admin panel</text>
  <text class="t body" x="48" y="172">_utils opens with no login</text>
  <text class="t body" x="48" y="191">no admin account set</text>
  <text class="t body" x="48" y="210">_all_dbs lists everything</text>

  <rect class="card" x="318" y="96" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="120">02 · SECRET DB</text>
  <text class="t head" x="336" y="146">Plaintext credentials</text>
  <text class="t body" x="336" y="172">one document</text>
  <text class="t body" x="336" y="191">passwordbackup field</text>
  <text class="t body" x="336" y="210">atena:t4qfzcc4qN##</text>

  <rect class="card" x="606" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="120">03 · SSH</text>
  <text class="t head" x="624" y="146">Password reuse</text>
  <text class="t body" x="624" y="172">atena@ubuntu</text>
  <text class="t body" x="624" y="191">user.txt in the home</text>
  <text class="t body" x="624" y="210">foothold on the host</text>

  <!-- Row 2 -->
  <rect class="card" x="30" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="294">04 · LOOPBACK</text>
  <text class="t head" x="48" y="320">Docker API</text>
  <text class="t body" x="48" y="346">127.0.0.1:2375</text>
  <text class="t body" x="48" y="365">no TLS, no auth</text>
  <text class="t body" x="48" y="384">root-equivalent access</text>

  <rect class="card" x="318" y="270" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="294">05 · CONTAINER</text>
  <text class="t head" x="336" y="320">Host root mounted</text>
  <text class="t body" x="336" y="346">-v /:/mnt</text>
  <text class="t body" x="336" y="365">root inside = host root</text>
  <text class="t body" x="336" y="384">chroot /mnt /bin/sh</text>

  <rect class="card" x="606" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="294">06 · ROOT</text>
  <text class="t head" x="624" y="320">root.txt</text>
  <text class="t body" x="624" y="346">/root on the host</text>
  <text class="t body" x="624" y="365">THM{RCE_us1ng...</text>
  <text class="t body" x="624" y="384">the box is complete</text>

  <!-- Arrows within rows -->
  <line x1="296" y1="164" x2="314" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="164" x2="602" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="296" y1="338" x2="314" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="338" x2="602" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Elbow from step 3 to step 4 -->
  <path d="M 738 232 L 738 251 L 162 251 L 162 266" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
