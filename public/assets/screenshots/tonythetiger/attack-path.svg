<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Diagram: the Tony the Tiger attack path from the blog image to root">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 15px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="429" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>

  <text class="t title" x="32" y="46">Tony the Tiger: from a blog photo to root</text>
  <text class="t sub" x="32" y="70">Six steps: leaked data, a deserialisation CVE, and two careless permissions</text>

  <!-- Row 1 -->
  <rect class="card" x="30" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="120">01 · PORT 80</text>
  <text class="t head" x="48" y="146">Tony's blog</text>
  <text class="t body" x="48" y="172">Frosted Flakes post</text>
  <text class="t body" x="48" y="191">curl, grep img → wget</text>
  <text class="t body" x="48" y="210">strings → Tony's flag</text>

  <rect class="card" x="318" y="96" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="120">02 · PORT 8080</text>
  <text class="t head" x="336" y="146">JBoss CVE-2015-7501</text>
  <text class="t body" x="336" y="172">JMXInvokerServlet</text>
  <text class="t body" x="336" y="191">deserialisation →</text>
  <text class="t body" x="336" y="210">shell as cmnatic</text>

  <rect class="card" x="606" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="120">03 · /HOME/JBOSS</text>
  <text class="t head" x="624" y="146">Leftover files</text>
  <text class="t body" x="624" y="172">.jboss.txt → flag</text>
  <text class="t body" x="624" y="191">note → likeaboss</text>
  <text class="t body" x="624" y="210">.bash_history → flag</text>

  <!-- Row 2 -->
  <rect class="card" x="30" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="294">04 · LATERAL</text>
  <text class="t head" x="48" y="320">su - jboss</text>
  <text class="t body" x="48" y="346">the note's password</text>
  <text class="t body" x="48" y="365">authenticates the</text>
  <text class="t body" x="48" y="384">service account</text>

  <rect class="card" x="318" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="336" y="294">05 · PRIVESC</text>
  <text class="t head" x="336" y="320">sudo find</text>
  <text class="t body" x="336" y="346">NOPASSWD on</text>
  <text class="t body" x="336" y="365">/usr/bin/find →</text>
  <text class="t body" x="336" y="384">-exec /bin/bash</text>

  <rect class="card" x="606" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="294">06 · ROOT</text>
  <text class="t head" x="624" y="320">root.txt</text>
  <text class="t body" x="624" y="346">base64 → MD5 hash</text>
  <text class="t body" x="624" y="365">→ zxcvbnm123456789</text>
  <text class="t body" x="624" y="384">the final answer</text>

  <!-- Arrows within rows -->
  <line x1="296" y1="164" x2="314" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="164" x2="602" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="296" y1="338" x2="314" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="338" x2="602" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Elbow from step 3 to step 4 -->
  <path d="M 738 232 L 738 251 L 162 251 L 162 266" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
