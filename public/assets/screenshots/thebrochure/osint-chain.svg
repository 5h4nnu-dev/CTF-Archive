<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Diagram of the The Brochure OSINT trail: brochure clues, resort Instagram account, following list, concierge posts, base64 fragments, decoded flag">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 14px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12px; }
      .path { fill: #c7c7dc; font-size: 11.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="349" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>
  <text class="t title" x="32" y="44">The Brochure: an OSINT trail in four hops</text>
  <text class="t sub" x="32" y="68">Nothing was exploited — each step followed a clue that was intentionally left in public view</text>

  <rect class="card" x="30" y="96" width="195" height="186" rx="10"/>
  <text class="t step" x="48" y="120">01 · FILE</text>
  <text class="t head" x="48" y="146">Brochure PNG</text>
  <text class="t body" x="48" y="172">Read the visible text</text>
  <text class="t body" x="48" y="191">\"Find us on\"</text>
  <text class="t mono path" x="48" y="210">Instagram</text>
  <text class="t body" x="48" y="236">Concierge named</text>
  <text class="t mono path" x="48" y="255">Vera</text>
  <text class="t body" x="48" y="275">Metadata: dead end</text>

  <rect class="card" x="245" y="96" width="195" height="186" rx="10"/>
  <text class="t step" x="263" y="120">02 · ACCOUNT</text>
  <text class="t head" x="263" y="146">Resort profile</text>
  <text class="t mono path" x="263" y="172">@thebyte...</text>
  <text class="t mono path" x="263" y="189">lotusresort</text>
  <text class="t body" x="263" y="214">Two posts, no clues</text>
  <text class="t body" x="263" y="233">Following list has</text>
  <text class="t body" x="263" y="252">one account only</text>
  <text class="t body" x="263" y="275">The hidden link</text>

  <rect class="card" x="460" y="96" width="195" height="186" rx="10" stroke="#6366f1"/>
  <text class="t step" x="478" y="120">03 · FRAGMENTS</text>
  <text class="t head" x="478" y="146">Vera's posts</text>
  <text class="t mono path" x="478" y="172">@verathe...</text>
  <text class="t mono path" x="478" y="189">concierge</text>
  <text class="t body" x="478" y="214">Three sunset images</text>
  <text class="t body" x="478" y="233">One Base64 piece</text>
  <text class="t body" x="478" y="252">in each, left to right</text>
  <text class="t body" x="478" y="275">Join them in order</text>

  <rect class="card" x="675" y="96" width="195" height="186" rx="10" stroke="#6366f1"/>
  <text class="t step" x="693" y="120">04 · DECODE</text>
  <text class="t head" x="693" y="146">Base64 string</text>
  <text class="t body" x="693" y="172"> cyberchef or</text>
  <text class="t mono path" x="693" y="189">base64 -d</text>
  <text class="t body" x="693" y="214">Decoded text</text>
  <text class="t mono path" x="693" y="233">THM{V3r@s...</text>
  <text class="t body" x="693" y="259">One flag</text>
  <text class="t body" x="693" y="275">Question answered</text>

  <line x1="227" y1="189" x2="241" y2="189" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="189" x2="456" y2="189" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="657" y1="189" x2="671" y2="189" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="t body" x="32" y="318">The challenge rewards reading, relationship mapping, and recognising an encoding — not a technical exploit.</text>
</svg>
