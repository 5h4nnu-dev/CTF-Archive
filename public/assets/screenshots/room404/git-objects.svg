<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Diagram of how an exposed Git repository is reconstructed from HEAD, refs, commit objects, trees, and blobs">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 13.5px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12px; }
      .path { fill: #c7c7dc; font-size: 11.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>
  <text class="t title" x="32" y="44">Why dumping .git gives you the source back</text>
  <text class="t sub" x="32" y="68">Git is a content-addressed store: follow the references and the files reassemble themselves</text>

  <rect class="card" x="30" y="100" width="156" height="136" rx="10"/>
  <text class="t step" x="46" y="124">POINTER</text>
  <text class="t mono path" x="46" y="150">.git/HEAD</text>
  <text class="t body" x="46" y="176">ref: refs/heads/</text>
  <text class="t mono path" x="46" y="193">main</text>
  <text class="t body" x="46" y="219">Plain text</text>

  <rect class="card" x="210" y="100" width="156" height="136" rx="10"/>
  <text class="t step" x="226" y="124">REFERENCE</text>
  <text class="t mono path" x="226" y="150">refs/heads/main</text>
  <text class="t body" x="226" y="176">Contains the commit</text>
  <text class="t body" x="226" y="193">SHA-1 for the tip</text>
  <text class="t mono path" x="226" y="219">0f13550...</text>

  <rect class="card" x="390" y="100" width="156" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="406" y="124">COMMIT</text>
  <text class="t body" x="406" y="150">objects/0f/1355...</text>
  <text class="t body" x="406" y="176">Zlib-compressed</text>
  <text class="t body" x="406" y="193">commit object points</text>
  <text class="t body" x="406" y="210">at the root tree</text>
  <text class="t body" x="406" y="229">Zlib, not plaintext</text>

  <rect class="card" x="570" y="100" width="156" height="136" rx="10"/>
  <text class="t step" x="586" y="124">TREE</text>
  <text class="t body" x="586" y="150">Lists filenames and</text>
  <text class="t body" x="586" y="167">their blob hashes</text>
  <text class="t body" x="586" y="193">git ls-tree -r HEAD</text>
  <text class="t body" x="586" y="219">3 files</text>

  <rect class="card" x="750" y="100" width="120" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="766" y="124">BLOBS</text>
  <text class="t body" x="766" y="150">README.md</text>
  <text class="t body" x="766" y="167">app.js</text>
  <text class="t body" x="766" y="184">index.html</text>
  <text class="t body" x="766" y="219">The flag is here</text>

  <line x1="188" y1="168" x2="206" y2="168" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="368" y1="168" x2="386" y2="168" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="548" y1="168" x2="566" y2="168" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="728" y1="168" x2="746" y2="168" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>

  <text class="t body" x="32" y="278">git-dumper follows this chain over HTTP; wget --mirror downloads it, and git checkout . materialises the files.</text>
  <text class="t body" x="32" y="299">If directory browsing is on, every step is readable without any special Git knowledge.</text>
</svg>
