<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Diagram showing keylogger exfiltration: keystroke XORed with key, base64 encoded, sent as hotel_sess_state cookie">
  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 14px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12px; }
      .path { fill: #c7c7dc; font-size: 11.5px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>
  <text class="t title" x="32" y="44">Packed Light: one keystroke per request</text>
  <text class="t sub" x="32" y="68">The C2 channel hides in a normal-looking Cookie header</text>

  <rect class="card" x="30" y="96" width="185" height="140" rx="10"/>
  <text class="t step" x="48" y="120">CAPTURE</text>
  <text class="t head" x="48" y="146">Keystroke</text>
  <text class="t body" x="48" y="172">pynput listener</text>
  <text class="t body" x="48" y="191">captures one char</text>
  <text class="t mono path" x="48" y="217">"T", "H", "M"...</text>

  <rect class="card" x="240" y="96" width="185" height="140" rx="10"/>
  <text class="t step" x="258" y="120">ENCODE</text>
  <text class="t head" x="258" y="146">XOR</text>
  <text class="t mono path" x="258" y="172">H0t3lSt@ff0Nly</text>
  <text class="t mono path" x="258" y="191">K3epS3cr3t!</text>
  <text class="t body" x="258" y="217">repeating-key XOR</text>

  <rect class="card" x="450" y="96" width="185" height="140" rx="10"/>
  <text class="t step" x="468" y="120">WRAP</text>
  <text class="t head" x="468" y="146">Base64</text>
  <text class="t body" x="468" y="172">Encrypted bytes</text>
  <text class="t body" x="468" y="191">become cookie-safe</text>
  <text class="t mono path" x="468" y="217">text value</text>

  <rect class="card" x="660" y="96" width="210" height="140" rx="10" stroke="#6366f1"/>
  <text class="t step" x="678" y="120">EXFIL</text>
  <text class="t head" x="678" y="146">HTTP GET</text>
  <text class="t mono path" x="678" y="172">Cookie:</text>
  <text class="t mono path" x="678" y="191">hotel_sess_state=...</text>
  <text class="t body" x="678" y="217">to byte-lotus-hotel.thm</text>

  <line x1="217" y1="166" x2="236" y2="166" stroke="#6366f1" stroke-width="2" marker-end="url(#pl-arrow)"/>
  <line x1="427" y1="166" x2="446" y2="166" stroke="#6366f1" stroke-width="2" marker-end="url(#pl-arrow)"/>
  <line x1="637" y1="166" x2="656" y2="166" stroke="#6366f1" stroke-width="2" marker-end="url(#pl-arrow)"/>

  <text class="t body" x="32" y="272">Defenders can recover the plaintext by reversing the same steps in capture order.</text>
</svg>
