<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Diagram: six questions that organise Linux privilege escalation enumeration">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 15px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="429" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>

  <text class="t title" x="32" y="46">Linux privilege escalation: six questions to ask</text>
  <text class="t sub" x="32" y="70">Every task in this room is one answer to one of them</text>

  <!-- Row 1 -->
  <rect class="card" x="30" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="120">01 · IDENTITY</text>
  <text class="t head" x="48" y="146">What am I?</text>
  <text class="t body" x="48" y="172">id, groups, sudo -l</text>
  <text class="t body" x="48" y="191">uname -r, /etc/os-release</text>
  <text class="t body" x="48" y="210">kernel and distro version</text>

  <rect class="card" x="318" y="96" width="264" height="136" rx="10" stroke="#6366f1"/>
  <text class="t step" x="336" y="120">02 · CREDENTIALS</text>
  <text class="t head" x="336" y="146">What was left behind?</text>
  <text class="t body" x="336" y="172">shell history</text>
  <text class="t body" x="336" y="191">config files, SSH keys</text>
  <text class="t body" x="336" y="210">readable /etc/shadow</text>

  <rect class="card" x="606" y="96" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="120">03 · PERMISSIONS</text>
  <text class="t head" x="624" y="146">What can I change?</text>
  <text class="t body" x="624" y="172">SUID and SGID binaries</text>
  <text class="t body" x="624" y="191">writable scripts</text>
  <text class="t body" x="624" y="210">writable passwd or shadow</text>

  <!-- Row 2 -->
  <rect class="card" x="30" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="48" y="294">04 · SCHEDULES</text>
  <text class="t head" x="48" y="320">What runs as root?</text>
  <text class="t body" x="48" y="346">/etc/crontab, cron.d</text>
  <text class="t body" x="48" y="365">systemd timers</text>
  <text class="t body" x="48" y="384">writable job targets</text>

  <rect class="card" x="318" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="336" y="294">05 · ENVIRONMENT</text>
  <text class="t head" x="336" y="320">What does root trust?</text>
  <text class="t body" x="336" y="346">PATH lookup</text>
  <text class="t body" x="336" y="365">LD_PRELOAD, LD_LIBRARY_PATH</text>
  <text class="t body" x="336" y="384">exported bash functions</text>

  <rect class="card" x="606" y="270" width="264" height="136" rx="10"/>
  <text class="t step" x="624" y="294">06 · SERVICES</text>
  <text class="t head" x="624" y="320">What is over-privileged?</text>
  <text class="t body" x="624" y="346">daemons running as root</text>
  <text class="t body" x="624" y="365">MySQL UDFs, plugins</text>
  <text class="t body" x="624" y="384">old kernels and CVEs</text>

  <!-- Arrows within rows -->
  <line x1="296" y1="164" x2="314" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="164" x2="602" y2="164" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="296" y1="338" x2="314" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="338" x2="602" y2="338" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
