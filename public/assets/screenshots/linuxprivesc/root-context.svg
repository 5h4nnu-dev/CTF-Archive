<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Table diagram: five mechanisms that run user-influenced code as root">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .th { fill: #6366f1; font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; }
      .cell { fill: #a8a8bd; font-size: 12.5px; }
      .mech { fill: #e4e4ef; font-size: 13.5px; font-weight: 600; }
      .rule { stroke: #1e1e2e; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>

  <text class="t title" x="32" y="44">Where the privilege boundary is crossed</text>
  <text class="t sub" x="32" y="68">The mechanism differs; the pattern is always root code reading user-controlled input</text>

  <text class="t th" x="44" y="104">MECHANISM</text>
  <text class="t th" x="222" y="104">WHY IT RUNS AS ROOT</text>
  <text class="t th" x="548" y="104">WHAT THE USER CONTROLS</text>

  <line class="rule" x1="32" y1="116" x2="868" y2="116"/>

  <!-- Row 1 -->
  <text class="t mech" x="44" y="146">sudo</text>
  <text class="t cell" x="222" y="146">a sudoers rule names the program</text>
  <text class="t cell" x="548" y="146">its arguments, and env vars it keeps</text>
  <line class="rule" x1="32" y1="160" x2="868" y2="160"/>

  <!-- Row 2 -->
  <text class="t mech" x="44" y="190">SUID / SGID</text>
  <text class="t cell" x="222" y="190">the s bit makes the effective UID 0</text>
  <text class="t cell" x="548" y="190">PATH, library paths, shell features</text>
  <line class="rule" x1="32" y1="204" x2="868" y2="204"/>

  <!-- Row 3 -->
  <text class="t mech" x="44" y="234">cron</text>
  <text class="t cell" x="222" y="234">the job's user field says root</text>
  <text class="t cell" x="548" y="234">the script, PATH, wildcard filenames</text>
  <line class="rule" x1="32" y1="248" x2="868" y2="248"/>

  <!-- Row 4 -->
  <text class="t mech" x="44" y="278">NFS</text>
  <text class="t cell" x="222" y="278">no_root_squash keeps the client's root</text>
  <text class="t cell" x="548" y="278">files and SUID bits on the share</text>
  <line class="rule" x1="32" y1="292" x2="868" y2="292"/>

  <!-- Row 5 -->
  <text class="t mech" x="44" y="322">services</text>
  <text class="t cell" x="222" y="322">the daemon starts with euid 0</text>
  <text class="t cell" x="548" y="322">plugins, queries, config files</text>
  <line class="rule" x1="32" y1="336" x2="868" y2="336"/>

  <text class="t sub" x="32" y="368">Kernel exploits are the exception: they do not abuse a root service, they abuse the kernel itself.</text>
</svg>
