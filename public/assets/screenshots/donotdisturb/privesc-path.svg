<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Diagram of the privilege escalation path from a poolside shell through the Node inspector to pipelinesvc and a raw disk read with debugfs">
  <defs>
    <marker id="pv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; }
      .title { fill: #e4e4ef; font-size: 20px; font-weight: 600; }
      .sub { fill: #8888a0; font-size: 13px; }
      .step { fill: #6366f1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
      .head { fill: #e4e4ef; font-size: 13.5px; font-weight: 600; }
      .body { fill: #a8a8bd; font-size: 12px; }
      .path { fill: #c7c7dc; font-size: 11.5px; }
      .note { fill: #c8f0d0; font-size: 12px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="#0f0f16" stroke="#1e1e2e"/>
  <text class="t title" x="32" y="44">Privilege escalation without becoming root first</text>
  <text class="t sub" x="32" y="68">A debugger socket and a dangerous supplementary group</text>

  <rect class="card" x="30" y="98" width="185" height="150" rx="10"/>
  <text class="t step" x="48" y="122">WE HAVE</text>
  <text class="t mono path" x="48" y="148">poolside</text>
  <text class="t body" x="48" y="174">Interactive shell</text>
  <text class="t body" x="48" y="193">from EJS SSTI</text>
  <text class="t body" x="48" y="219">Local user on box</text>
  <text class="t body" x="48" y="238">No sudo rights</text>

  <rect class="card hot" x="240" y="98" width="185" height="150" rx="10" stroke="#6366f1"/>
  <text class="t step" x="258" y="122">DISCOVER</text>
  <text class="t mono path" x="258" y="148">ps -ef</text>
  <text class="t mono path" x="258" y="171">ss -ltnp</text>
  <text class="t body" x="258" y="197">Node running with</text>
  <text class="t mono path" x="258" y="219">--inspect=127.0.0.1</text>
  <text class="t mono path" x="258" y="238">:9229</text>

  <rect class="card" x="450" y="98" width="185" height="150" rx="10"/>
  <text class="t step" x="468" y="122">EXPLOIT</text>
  <text class="t mono path" x="468" y="148">/json/list</text>
  <text class="t mono path" x="468" y="171">WebSocket</text>
  <text class="t body" x="468" y="197">Chrome DevTools</text>
  <text class="t mono path" x="468" y="219">Runtime.evaluate</text>
  <text class="t body" x="468" y="238">execSync as target</text>

  <rect class="card hot" x="660" y="98" width="210" height="150" rx="10" stroke="#6366f1"/>
  <text class="t step" x="678" y="122">RESULT</text>
  <text class="t mono path" x="678" y="148">pipelinesvc</text>
  <text class="t mono path" x="678" y="171">groups=...,6(disk)</text>
  <text class="t body" x="678" y="197">findmnt root device</text>
  <text class="t mono path" x="678" y="219">debugfs -R 'cat ...'</text>
  <text class="t body" x="678" y="238">root flag revealed</text>

  <line x1="217" y1="173" x2="236" y2="173" stroke="#6366f1" stroke-width="2" marker-end="url(#pv-arrow)"/>
  <line x1="427" y1="173" x2="446" y2="173" stroke="#6366f1" stroke-width="2" marker-end="url(#pv-arrow)"/>
  <line x1="637" y1="173" x2="656" y2="173" stroke="#6366f1" stroke-width="2" marker-end="url(#pv-arrow)"/>

  <rect class="card" x="170" y="268" width="560" height="36" rx="9"/>
  <text class="t note" x="188" y="292">Do not bind debuggers to production interfaces — localhost is not a security boundary.</text>
</svg>
